name: Reddit Bot Scheduled Task

on:
  schedule:
    # 每天 UK 时间 10:50 启动（UTC 09:50，夏令时 BST），在发帖窗口 11:00 前提前准备
    - cron: '50 9 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 600  # 最长运行 10 小时，覆盖 UK 11:00-20:00 发帖窗口

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Reddit bot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          USER_AGENT: ${{ secrets.USER_AGENT }}
        # 运行 9 小时后自动停止（覆盖 UK 11:00-20:00 窗口后退出）
        run: timeout 32400 python main.py || true
